name: northline-booking
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_DB: booking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    volumes:
      [
        postgres_data:/var/lib/postgresql/data,
        ./db/init-app.sh:/docker-entrypoint-initdb.d/01-app.sh:ro,
      ]
    ports: ["127.0.0.1:55461:5432"]
    networks: [database]
    restart: unless-stopped
    mem_limit: 320m
    cpus: 0.5
    pids_limit: 120
    healthcheck:
      {
        test: [CMD-SHELL, "pg_isready -U booking -d booking"],
        interval: 5s,
        timeout: 3s,
        retries: 15,
      }
    logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }
  api:
    build: .
    environment:
      DATABASE_URL: postgres://booking_app:${APP_DB_PASSWORD}@db:5432/booking
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4300
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5173}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ORIGIN_SECRET: ${ORIGIN_SECRET:-}
      AUTOMATION_SECRET: ${AUTOMATION_SECRET:?Set AUTOMATION_SECRET}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/northline-booking
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:4300:4300"]
    networks: [database, edge, automation]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 90
    healthcheck:
      {
        test:
          [
            CMD,
            node,
            -e,
            "fetch('http://127.0.0.1:4300/api/health',{headers:{'x-origin-secret':process.env.ORIGIN_SECRET||''}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
          ],
        interval: 30s,
        timeout: 5s,
        retries: 3,
      }
    logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.38.7
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 24
      N8N_LOG_LEVEL: warn
      NODE_OPTIONS: --max-old-space-size=512
    volumes: [n8n_data:/home/node/.n8n]
    ports: ["127.0.0.1:5683:5678"]
    networks: [automation]
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 180
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }
networks:
  database: {}
  edge: {}
  automation: {}
volumes:
  postgres_data: {}
  n8n_data: {}
